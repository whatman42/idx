# IDX Signal Bot — headless paper trading runtime (GitHub Actions)
# Schedule: Mon–Fri 09:30 UTC (= 16:30 Asia/Jakarta EOD window)
# Cron uses UTC. Weekend not scheduled (1-5). Holiday: in-process guard only.
# NO live trading. NO broker. NO GUI.
# Concurrency (optimized):
#   - schedule + OPERATIONAL/PAPER dispatch → idx-ops-ledger, cancel=false (ledger SSOT)
#   - TEST dispatch → idx-ops-test-<branch>, cancel=true (stale tests drop; no ledger risk)
# GitHub cron can still delay hours under platform load; concurrency only removes self-queue noise.

name: IDX Signal Bot

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "TEST | PAPER | OPERATIONAL"
        required: true
        default: "TEST"
        type: choice
        options: [TEST, PAPER, OPERATIONAL]
      force_schedule:
        description: "Bypass Asia/Jakarta EOD window (TEST/manual only)"
        required: false
        default: true
        type: boolean
      symbols:
        description: "ALL = full IDX universe, or comma-separated list"
        required: false
        default: "ALL"
      reset_portfolio:
        description: "EXPLICIT reset paper portfolio (new session). Default false."
        required: true
        default: false
        type: boolean

concurrency:
  # One live ledger queue for real paper ops; TEST never blocks schedule.
  group: ${{ github.event_name == 'schedule' && 'idx-ops-ledger' || (github.event.inputs.mode == 'TEST' && format('idx-ops-test-{0}', github.ref_name) || 'idx-ops-ledger') }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'TEST' }}

permissions:
  contents: write
  actions: write

jobs:
  signal:
    if: github.repository == 'whatman42/idx'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      IDX_TELEGRAM_ALLOW_PAPER: "1"
      IDX_CSV_PATH: ${{ github.workspace }}/data/ops/ohlcv.csv
      PYTHONUNBUFFERED: "1"
      IDX_MAX_NOTIFY_SIGNALS: "20"
      IDX_MAX_PORTFOLIO_ENTRIES: "15"
      IDX_WORKFLOW_RUN_ID: ${{ github.run_id }}
      IDX_WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
      IDX_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare dirs
        run: mkdir -p data/ops state/ops artifacts/ops

      - name: Resolve mode + cycle_id
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="OPERATIONAL"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="OPERATIONAL"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          RESET="${{ github.event.inputs.reset_portfolio }}"
          if [ -z "$RESET" ]; then RESET="false"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then RESET="false"; fi
          echo "reset=$RESET" >> "$GITHUB_OUTPUT"
          TD=$(TZ=Asia/Jakarta date +%F)
          echo "trading_date=$TD" >> "$GITHUB_OUTPUT"
          CYCLE="IDX-${TD}-${MODE}-${{ github.run_id }}-a${{ github.run_attempt }}"
          echo "cycle_id=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "IDX_CYCLE_ID=$CYCLE" >> "$GITHUB_ENV"
          echo "IDX_TRADING_DATE=$TD" >> "$GITHUB_ENV"
          echo "Resolved cycle_id=$CYCLE mode=$MODE trading_date=$TD"

      - name: Fetch public OHLCV (fail-closed on error)
        if: steps.mode.outputs.mode != 'TEST'
        run: |
          python -m src.python.ops.fetch_ohlcv \
            --symbols "${{ github.event.inputs.symbols || 'ALL' }}" \
            --out data/ops/ohlcv.csv --period 3mo --batch-size 80
        continue-on-error: false

      - name: Run signal bot (paper only)
        id: bot
        run: |
          FORCE="${{ github.event.inputs.force_schedule }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then FORCE=false; fi
          if [ -z "$FORCE" ]; then FORCE=true; fi
          ARGS=(--mode "${{ steps.mode.outputs.mode }}" --symbols "${{ github.event.inputs.symbols || 'ALL' }}" --state-dir state/ops --artifact-dir artifacts/ops)
          if [ "$FORCE" = "true" ]; then ARGS+=(--force-schedule); fi
          if [ "${{ steps.mode.outputs.reset }}" = "true" ]; then ARGS+=(--reset-portfolio); fi
          if [ -f "$IDX_CSV_PATH" ]; then ARGS+=(--csv "$IDX_CSV_PATH"); fi
          set +e
          python -m src.python.ops.signal_bot "${ARGS[@]}"
          RC=$?
          set -e
          echo "bot_exit=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Persist portfolio state (financial SSOT)
        if: always() && (steps.mode.outputs.mode == 'OPERATIONAL' || steps.mode.outputs.mode == 'PAPER')
        run: |
          if [ -f state/ops/paper_portfolio.json ]; then
            git config user.name "idx-ops-bot"
            git config user.email "idx-ops-bot@users.noreply.github.com"
            git add state/ops/paper_portfolio.json state/ops/notify_state.json state/ops/sessions || true
            git diff --staged --quiet || git commit -m "chore(ops): persist paper portfolio state cycle=${{ steps.mode.outputs.cycle_id }} [skip ci]"
            git push || echo "WARN: state push failed — artifact still uploaded"
          fi

      - name: Secret hygiene guard (no token shapes in report)
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.python.ops.runtime_cycle import secret_scan_text
          hits = []
          for p in Path("artifacts/ops").rglob("*"):
              if p.is_file() and p.stat().st_size < 2_000_000:
                  try:
                      t = p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  h = secret_scan_text(t)
                  if h:
                      hits.append(f"{p}:{h}")
          if hits:
              raise SystemExit("SECRET_SCAN_FAIL: " + "; ".join(hits[:5]))
          print("secret_scan=PASS")
          PY

      - name: Upload operational report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idx-ops-report-${{ github.run_id }}
          path: |
            artifacts/ops/
            state/ops/
          if-no-files-found: warn
          retention-days: 30
