name: Weekend Training
on:
  schedule:
    - cron: "0 2 * * 6"
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      stage:
        description: "Training stage"
        required: false
        default: "auto"
        type: choice
        options: [auto, exploration, validation]
concurrency:
  group: idx-training
  cancel-in-progress: false
jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      IDX_TRAINING_BUDGET_SEC: "1200"
      IDX_STAGE: ${{ github.event.inputs.stage || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m src.python.training.weekend_train --stage "$IDX_STAGE" --budget-sec "${IDX_TRAINING_BUDGET_SEC}"
