name: Ops Full Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/python/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/ops_certification.yml"

permissions:
  contents: read

concurrency:
  group: ops-full-cert
  cancel-in-progress: true

jobs:
  ops-cert:
    if: github.repository == 'whatman42/idx'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Architecture + data quality + feature guard + cold archive
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            tests/test_architecture_boundaries.py \
            tests/test_data_quality.py \
            tests/test_feature_snapshot_label_guard.py \
            tests/test_cold_archive.py \
            -q --tb=line

      - name: Ops certification matrix
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_ops_certification_matrix.py -q --tb=short

      - name: Promotion / research / paper regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            tests/test_promotion_gate_v2.py \
            tests/test_promotion_negative_path.py \
            tests/test_instant_paper_portfolio.py \
            tests/test_research_wfa.py \
            -q --tb=line

      - name: Ops paper cert script
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ops_paper_cert.py

      - name: Write certification report
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
            "commit": os.environ.get("GITHUB_SHA", "")[:40],
            "workflow_run": os.environ.get("GITHUB_RUN_ID", ""),
            "timestamp": datetime.now(timezone.utc).isoformat(),
            "live_execution": False,
            "broker_execution": False,
            "checks": {
              "ARCHITECTURE": "PASS",
              "DATA_QUALITY": "PASS",
              "DAILY_E2E": "PASS",
              "RESTART_REPLAY": "PASS",
              "LEDGER_RECONSTRUCTION": "PASS",
              "WFA_TEMPORAL": "PASS",
              "TRAINING_REPRODUCIBILITY": "PASS",
              "EVIDENCE_PACKAGE": "PASS",
              "PROMOTION_NEGATIVE": "PASS",
              "GOVERNOR_INVARIANTS": "PASS",
              "TELEGRAM_SSOT": "PASS",
              "COLD_ARCHIVE_REGRESSION": "PASS",
            },
            "note": "Statuses reflect pytest steps; job fails if any pytest step fails.",
          }
          open("artifacts/ops_certification_report.json","w").write(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Upload cert artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-certification-${{ github.run_id }}
          path: artifacts/ops_certification_report.json
          retention-days: 14
