# Crypto Research Memory certification — schema crypto_* only.
# Does NOT mutate paper ledger. Does NOT enable live execution.

name: Crypto Turso Research Memory Cert

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1"

concurrency:
  group: crypto-turso-cert
  cancel-in-progress: true

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Authority invariants
        run: |
          python - <<'PY'
          from src.python.crypto.research_memory import (
              crypto_memory_cannot_mutate_ledger,
              crypto_memory_cannot_enable_live,
          )
          from src.python.crypto.colab_bridge import colab_cannot_enable_live, colab_cannot_submit_orders
          assert crypto_memory_cannot_mutate_ledger()
          assert crypto_memory_cannot_enable_live()
          assert colab_cannot_enable_live()
          assert colab_cannot_submit_orders()
          print("authority_PASS")
          PY
      - name: Local SQLite schema + R/W
        run: |
          python - <<'PY'
          from src.python.crypto.research_memory import connect_crypto_sqlite
          mem = connect_crypto_sqlite(":memory:")
          assert mem.status.value == "AVAILABLE"
          r = mem.record_cycle({
              "status": "SUCCESS",
              "generated_at": "2026-09-29T00:00:00+00:00",
              "signal_coverage": "1/1",
              "signal_coverage_mode": "SAMPLED",
              "ohlcv_ok": 1,
              "signals_count": 0,
              "fills_paper": 0,
              "universe": {"eligible_count": 1},
              "portfolio": {"equity": 10000},
              "strategy_id": "crypto_rule_sma20",
          })
          assert r["ok"] and r["paper_blocked"] is False
          assert mem.record_evidence(evidence_id="e1", strategy_id="crypto_rule_sma20", payload={"n": 1})
          rows = list(mem._conn.execute(
              "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'crypto_%'"
          ))
          names = {r[0] for r in rows}
          assert "crypto_cycle_logs" in names
          assert "experiments" not in names
          mem.close()
          print("sqlite_schema_PASS", sorted(names))
          PY
      - name: Paper independence from Turso unavailable
        run: |
          python - <<'PY'
          from src.python.crypto.research_memory import CryptoResearchMemory, CryptoMemoryStatus
          mem = CryptoResearchMemory(status=CryptoMemoryStatus.UNAVAILABLE)
          r = mem.record_cycle({"status": "SUCCESS"})
          assert r["ok"] is False and r["paper_blocked"] is False
          print("turso_down_paper_not_blocked_PASS")
          PY
      - name: Optional real Turso (if secrets present)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          url = os.environ.get("TURSO_DATABASE_URL", "").strip()
          tok = os.environ.get("TURSO_AUTH_TOKEN", "").strip()
          if not url or not tok:
              print("SKIP_NO_TURSO_SECRETS")
              raise SystemExit(0)
          from src.python.crypto.research_memory import get_crypto_research_memory
          mem = get_crypto_research_memory()
          print("backend", mem._backend, "status", mem.status.value)
          if mem.status.value == "UNAVAILABLE":
              print("TURSO_UNAVAILABLE_SOFT", mem.last_error)
              raise SystemExit(0)
          r = mem.record_cycle({
              "status": "CERT",
              "generated_at": "2026-09-29T12:00:00+00:00",
              "signal_coverage": "0/0",
              "ohlcv_ok": 0,
              "signals_count": 0,
              "fills_paper": 0,
              "universe": {"eligible_count": 0},
              "portfolio": {"equity": 0},
              "strategy_id": "crypto_rule_sma20",
              "cycle_id": "crypto-cert-workflow",
          })
          print("turso_write", r)
          assert r.get("paper_blocked") is False
          mem.close()
          print("turso_remote_PASS")
          PY
