# Google Drive cold-archive certification — secrets only, main-only, no PR.
name: GDrive Cold Storage Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdrive-cold-cert-main
  cancel-in-progress: false

jobs:
  gdrive-cold-cert:
    if: >-
      github.repository == 'whatman42/idx'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Refusing non-dispatch event"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-httplib2 || true

      - name: Run local archive suite (always)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_cold_archive.py -q --tb=line

      - name: Credential presence (no values)
        id: cred
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "CREDENTIAL_PRESENT=false"
            echo "REAL GDRIVE CLOUD = NOT EXECUTED"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CREDENTIAL_PRESENT=true"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Run real GDrive certification
        if: steps.cred.outputs.present == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/gdrive_cold_cert.py

      - name: Report cloud status when skipped
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "LOCAL/MOCK = PASS (pytest above)"
          echo "REAL GDRIVE CLOUD = NOT EXECUTED"
          echo "GDRIVE COLD STORAGE CERTIFICATION = NOT CERTIFIED"
